<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title>My Purchases</title>
    <style>
        .purchase-card {
            height: 100%;
            transition: transform 0.2s ease-in-out;
        }
        .purchase-card:hover {
            transform: translateY(-2px);
        }
        .purchase-image {
            height: 150px;
            object-fit: cover;
            width: 100%;
        }
        .purchase-date {
            font-size: 0.9em;
            color: #6c757d;
        }
        .price-display {
            font-size: 1.2em;
            font-weight: bold;
            color: #28a745;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>🛒 My Purchases</h2>
        <a class="btn btn-primary" th:href="@{/games}">Browse Games</a>
    </div>

    <!-- Success/Error Messages -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Purchases Grid -->
    <div class="row g-4" th:if="${orderPage.totalElements > 0}">
        <div class="col-lg-4 col-md-6 col-sm-12" th:each="order : ${orderPage}">
            <div class="card purchase-card h-100">
                <!-- Game Image -->
                <div th:if="${order.game.imageUrl != null and !order.game.imageUrl.isEmpty()}">
                    <img th:src="${order.game.imageUrl}" class="card-img-top purchase-image" alt="Game Image" 
                         onerror="this.src='https://via.placeholder.com/300x150?text=No+Image'">
                </div>
                <div th:unless="${order.game.imageUrl != null and !order.game.imageUrl.isEmpty()}">
                    <img src="https://via.placeholder.com/300x150?text=No+Image" class="card-img-top purchase-image" alt="No Image">
                </div>
                
                <!-- Card Body -->
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">
                        <a th:href="@{'/games/' + ${order.game.id}}" th:text="${order.game.title}" class="text-decoration-none"></a>
                    </h5>
                    <p class="card-text" th:text="${order.game.description}"></p>
                    
                    <!-- Game Details -->
                    <div class="mb-2">
                        <span th:if="${order.game.genre != null and !order.game.genre.isEmpty()}" class="badge bg-primary me-1" th:text="${order.game.genre}"></span>
                        <span th:if="${order.game.platform != null and !order.game.platform.isEmpty()}" class="badge bg-info me-1" th:text="${order.game.platform}"></span>
                    </div>
                    
                    <!-- Purchase Info -->
                    <div class="mt-auto">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="price-display">$<span th:text="${#numbers.formatDecimal(order.price, 1, 2)}"></span></span>
                            <span class="purchase-date" th:text="${#temporals.format(order.purchaseDate, 'MMM dd, yyyy')}"></span>
                        </div>
                        
                        <!-- Action Buttons -->
                        <div class="d-flex gap-2">
                            <a class="btn btn-outline-primary btn-sm" th:href="@{'/games/' + ${order.game.id}}">View Game</a>
                            <a class="btn btn-outline-success btn-sm" th:href="@{'/reviews/add/' + ${order.game.id}}">Add Review</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- No Purchases Message -->
    <div th:if="${orderPage.totalElements == 0}" class="text-center py-5">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title text-muted">No purchases yet</h5>
                <p class="card-text text-muted">Start shopping to see your purchased games here.</p>
                <a class="btn btn-primary" th:href="@{/games}">Browse Games</a>
            </div>
        </div>
    </div>

    <!-- Pagination -->
    <nav th:if="${orderPage.totalPages > 1}" class="mt-4">
        <ul class="pagination justify-content-center">
            <li th:classappend="${orderPage.first} ? 'disabled'" class="page-item">
                <a class="page-link" th:href="@{/orders(page=${orderPage.number - 1}, size=${orderPage.size})}">Previous</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, orderPage.totalPages - 1)}"
                th:classappend="${i} == ${orderPage.number} ? 'active'">
                <a class="page-link" th:href="@{/orders(page=${i}, size=${orderPage.size})}" th:text="${i + 1}"></a>
            </li>
            <li th:classappend="${orderPage.last} ? 'disabled'" class="page-item">
                <a class="page-link" th:href="@{/orders(page=${orderPage.number + 1}, size=${orderPage.size})}">Next</a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
