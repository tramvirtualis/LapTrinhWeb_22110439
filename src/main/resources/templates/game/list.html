<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title>Games Store</title>
    <style>
        .game-card {
            height: 100%;
            transition: transform 0.2s ease-in-out;
        }
        .game-card:hover {
            transform: translateY(-5px);
        }
        .game-image {
            height: 200px;
            object-fit: cover;
            width: 100%;
        }
        .game-card-body {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .game-content {
            flex-grow: 1;
        }
        .game-actions {
            margin-top: auto;
        }
        .price-tag {
            font-size: 1.2em;
            font-weight: bold;
            color: #28a745;
        }
        .genre-badge {
            font-size: 0.8em;
        }
        .platform-badge {
            font-size: 0.8em;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>🎮 Games Store</h2>
        <div th:if="${userRole == 'ADMIN'}">
            <a class="btn btn-primary" th:href="@{/games/new}">Add Game</a>
        </div>
    </div>

    <form class="row g-2 mb-4" method="get" th:action="@{/games}">
        <div class="col-auto">
            <input class="form-control" type="text" name="q" placeholder="Search by title, description, genre, or platform" th:value="${keyword}">
        </div>
        <div class="col-auto">
            <button class="btn btn-outline-secondary" type="submit">Search</button>
        </div>
    </form>

    <!-- Games Grid -->
    <div class="row g-4" th:if="${gamePage.totalElements > 0}">
        <div class="col-lg-4 col-md-6 col-sm-12" th:each="g : ${gamePage}">
            <div class="card game-card h-100">
                <!-- Game Image -->
                <div th:if="${g.imageUrl != null and !g.imageUrl.isEmpty()}">
                    <img th:src="${g.imageUrl}" class="card-img-top game-image" alt="Game Image" 
                         onerror="this.src='https://via.placeholder.com/300x200?text=No+Image'">
                </div>
                <div th:unless="${g.imageUrl != null and !g.imageUrl.isEmpty()}">
                    <img src="https://via.placeholder.com/300x200?text=No+Image" class="card-img-top game-image" alt="No Image">
                </div>
                
                <!-- Card Body -->
                <div class="card-body game-card-body">
                    <div class="game-content">
                        <h5 class="card-title">
                            <a th:href="@{'/games/' + ${g.id}}" th:text="${g.title}" class="text-decoration-none"></a>
                        </h5>
                        <p class="card-text" th:text="${g.description}"></p>
                        
                        <!-- Game Details -->
                        <div class="mb-2">
                            <span th:if="${g.genre != null and !g.genre.isEmpty()}" class="badge bg-primary genre-badge me-1" th:text="${g.genre}"></span>
                            <span th:if="${g.platform != null and !g.platform.isEmpty()}" class="badge bg-info platform-badge me-1" th:text="${g.platform}"></span>
                        </div>
                        
                        <!-- Price -->
                        <div th:if="${g.price != null}" class="price-tag">
                            $<span th:text="${#numbers.formatDecimal(g.price, 1, 2)}"></span>
                        </div>
                    </div>
                    
                    <!-- Action Buttons -->
                    <div class="game-actions">
                        <div class="d-flex gap-2">
                            <!-- Admin Actions -->
                            <div th:if="${userRole == 'ADMIN'}">
                                <a class="btn btn-warning btn-sm" th:href="@{'/games/' + ${g.id} + '/edit'}">
                                    <i class="bi bi-pencil"></i> Edit
                                </a>
                                <form th:action="@{'/games/' + ${g.id} + '/delete'}" method="post" class="d-inline">
                                    <button class="btn btn-danger btn-sm" type="submit" onclick="return confirm('Delete this game?')">
                                        <i class="bi bi-trash"></i> Delete
                                    </button>
                                </form>
                            </div>
                            
                            <!-- Customer Actions -->
                            <div th:if="${userRole == 'CUSTOMER'}">
                                <!-- Buy Button (if not purchased) -->
                                <form th:if="${purchaseStatus == null or !purchaseStatus[g.id]}" th:action="@{'/orders/purchase/' + ${g.id}}" method="post" class="d-inline">
                                    <button class="btn btn-success btn-sm" type="submit">
                                        <i class="bi bi-cart-plus"></i> Buy Now
                                    </button>
                                </form>
                                
                                <!-- Purchased Actions -->
                                <div th:if="${purchaseStatus != null and purchaseStatus[g.id]}" class="d-flex gap-1">
                                    <span class="badge bg-success">Purchased</span>
                                    <a class="btn btn-outline-primary btn-sm" th:href="@{'/reviews/add/' + ${g.id}}">
                                        <i class="bi bi-star"></i> Review
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- No Games Message -->
    <div th:if="${gamePage.totalElements == 0}" class="text-center py-5">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title text-muted">No games found</h5>
                <p class="card-text text-muted">Try adjusting your search criteria or add a new game.</p>
                <div th:if="${userRole == 'ADMIN'}">
                    <a class="btn btn-primary" th:href="@{/games/new}">Add First Game</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Pagination -->
    <nav th:if="${gamePage.totalPages > 1}" class="mt-4">
        <ul class="pagination justify-content-center">
            <li th:classappend="${gamePage.first} ? 'disabled'" class="page-item">
                <a class="page-link" th:href="@{/games(page=${gamePage.number - 1}, size=${gamePage.size}, q=${keyword})}">Previous</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, gamePage.totalPages - 1)}"
                th:classappend="${i} == ${gamePage.number} ? 'active'">
                <a class="page-link" th:href="@{/games(page=${i}, size=${gamePage.size}, q=${keyword})}" th:text="${i + 1}"></a>
            </li>
            <li th:classappend="${gamePage.last} ? 'disabled'" class="page-item">
                <a class="page-link" th:href="@{/games(page=${gamePage.number + 1}, size=${gamePage.size}, q=${keyword})}">Next</a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
