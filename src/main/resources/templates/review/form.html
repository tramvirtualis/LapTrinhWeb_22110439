<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title>Add Review</title>
    <style>
        .star-rating {
            font-size: 2em;
            color: #ffc107;
        }
        .star-rating input {
            display: none;
        }
        .star-rating label {
            cursor: pointer;
            transition: color 0.2s;
        }
        .star-rating label:hover,
        .star-rating label:hover ~ label,
        .star-rating input:checked ~ label {
            color: #ffc107;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="row">
        <div class="col-md-8">
            <h2>⭐ Add Review</h2>
            
            <!-- Game Info -->
            <div class="card mb-4">
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-3">
                            <img th:if="${game.imageUrl != null and !game.imageUrl.isEmpty()}" 
                                 th:src="${game.imageUrl}" class="img-fluid rounded" alt="Game Image"
                                 onerror="this.src='https://via.placeholder.com/200x150?text=No+Image'">
                            <img th:unless="${game.imageUrl != null and !game.imageUrl.isEmpty()}" 
                                 src="https://via.placeholder.com/200x150?text=No+Image" class="img-fluid rounded" alt="No Image">
                        </div>
                        <div class="col-md-9">
                            <h5 th:text="${game.title}"></h5>
                            <p class="text-muted" th:text="${game.description}"></p>
                            <div>
                                <span th:if="${game.genre != null and !game.genre.isEmpty()}" class="badge bg-primary me-1" th:text="${game.genre}"></span>
                                <span th:if="${game.platform != null and !game.platform.isEmpty()}" class="badge bg-info me-1" th:text="${game.platform}"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Review Form -->
            <form th:action="@{/reviews/add/{gameId}(gameId=${game.id})}" method="post" th:object="${review}">
                <div class="mb-3">
                    <label class="form-label">Rating</label>
                    <div class="star-rating">
                        <input type="radio" id="star5" name="rating" value="5" th:field="*{rating}">
                        <label for="star5">★</label>
                        <input type="radio" id="star4" name="rating" value="4" th:field="*{rating}">
                        <label for="star4">★</label>
                        <input type="radio" id="star3" name="rating" value="3" th:field="*{rating}">
                        <label for="star3">★</label>
                        <input type="radio" id="star2" name="rating" value="2" th:field="*{rating}">
                        <label for="star2">★</label>
                        <input type="radio" id="star1" name="rating" value="1" th:field="*{rating}">
                        <label for="star1">★</label>
                    </div>
                    <div class="text-danger" th:if="${#fields.hasErrors('rating')}" th:errors="*{rating}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Review Comment</label>
                    <textarea class="form-control" rows="4" th:field="*{comment}" 
                              placeholder="Share your thoughts about this game..." maxlength="500"></textarea>
                    <div class="form-text">Maximum 500 characters</div>
                    <div class="text-danger" th:if="${#fields.hasErrors('comment')}" th:errors="*{comment}"></div>
                </div>

                <div class="d-flex gap-2">
                    <button class="btn btn-primary" type="submit">Submit Review</button>
                    <a class="btn btn-secondary" th:href="@{'/games/' + ${game.id}}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
