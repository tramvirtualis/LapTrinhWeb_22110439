<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 Games Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/chat.css}">
    <style>
        .header-img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; }
        footer { margin-top: 2rem; padding: 1rem 0; border-top: 1px solid #eaeaea; color: #666; }
    </style>
    
</head>
<body>
<div th:replace="~{fragments/header :: site-header}"></div>

<main class="container" layout:fragment="content">
    <!-- page content here -->
    <div class="alert alert-info">Content goes here.</div>
    </main>

<div th:replace="~{fragments/footer :: site-footer}"></div>

<!-- Floating Chat Button -->
<div id="chatButton" class="floating-chat-button">
    <i class="fas fa-comments"></i>
</div>

<!-- Chat Widget -->
<div id="chatWidget" class="chat-widget" style="display: none;">
    <div class="chat-widget-header">
        <h6>Customer Support</h6>
        <div class="d-flex align-items-center">
            <span id="widgetConnectionStatus" class="badge bg-secondary me-2">Connecting...</span>
            <button id="closeChat" class="btn-close btn-close-white"></button>
        </div>
    </div>
    <div class="chat-widget-body">
        <div id="chatMessages" class="chat-messages-widget"></div>
        <div class="chat-input-widget">
            <div class="input-group">
                <input type="text" id="messageInput" class="form-control form-control-sm" placeholder="Type your message...">
                <button id="sendButton" class="btn btn-primary btn-sm">Send</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script th:src="@{/js/chat-widget.js}"></script>
</body>
</html>
