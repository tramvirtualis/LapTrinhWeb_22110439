<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Chat Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/chat.css}">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Active Sessions Sidebar -->
            <div class="col-md-3">
                <div class="sessions-sidebar">
                    <h6>Active Chat Sessions</h6>
                    <div id="activeSessions" class="list-group">
                        <!-- Active sessions will be listed here -->
                    </div>
                </div>
            </div>
            
            <!-- Chat Interface -->
            <div class="col-md-9">
                <div class="chat-container">
                    <div class="chat-header">
                        <h5>Support Agent Chat</h5>
                        <div class="connection-status">
                            <span id="connectionStatus" class="badge bg-secondary">Connecting...</span>
                        </div>
                    </div>
                    
                    <div class="chat-messages" id="chatMessages">
                        <div class="text-center text-muted">
                            <p>Select a chat session to start supporting customers</p>
                        </div>
                    </div>
                    
                    <div class="chat-input">
                        <div class="input-group">
                            <input type="text" id="messageInput" class="form-control" placeholder="Type your message..." disabled>
                            <button id="sendButton" class="btn btn-primary" disabled>Send</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden session ID -->
    <input type="hidden" id="sessionId" th:value="${sessionId ?: ''}">
    <input type="hidden" id="isAdmin" th:value="${isAdmin ?: false}">

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script th:src="@{/js/chat.js}"></script>
</body>
</html>
